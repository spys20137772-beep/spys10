<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 게임 모음</title>
<style>
:root{--bg:#0e1020;--card:#181b33;--line:#2a2f55;--ink:#f1f2ff;--dim:#9aa0cc;--acc:#7cf0c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:960px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0 0 4px;font-size:32px}
.sub{color:var(--dim);margin:0 0 20px;font-size:15px}
#q{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;outline:none;margin-bottom:18px}
#q:focus{border-color:var(--acc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc);outline:none}
.top{height:92px;display:flex;align-items:flex-end;padding:12px 14px;font-size:44px;font-weight:800;line-height:1;color:rgba(255,255,255,.9);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:18px;font-weight:700}
.desc{font-size:14px;color:var(--dim);line-height:1.45;flex:1;margin:0}
.go{margin-top:6px;color:var(--acc);font-weight:700;font-size:14px}
.lock{font-size:12px;color:#ffd36b}
.empty{color:var(--dim);padding:30px 0;text-align:center}
</style>
</head>
<body>
<main>
  <h1>내 게임 모음</h1>
  <p class="sub" id="count"></p>
  <input id="q" type="search" placeholder="게임 이름 찾기" aria-label="게임 이름 찾기" autocomplete="off">
  <div id="grid"></div>
</main>

<script>
/* ===== 여기만 고치면 돼: 게임 한 줄 = 카드 한 장 =====
   name: 이름 / url: 주소 / desc: 한 줄 설명(비워도 됨) / lock: true면 비밀번호 있는 게임 */
const BASE = 'https://spys20137772-beep.github.io/';
const GAMES = [
  { name: '한예성 강화',        url: BASE + '-/',      desc: '친구 전용. 입장 비밀번호가 필요해.', lock: true },
  { name: '공 배틀 시뮬레이터', url: BASE + 'spys1/',  desc: '' },
  { name: '보스 아레나',        url: BASE + 'spys2/',  desc: '' },
  { name: '파츠헌터',           url: BASE + 'spys3/',  desc: '총 250종을 모으고 파츠로 커스텀하는 쿼터뷰 오픈월드 슈팅 RPG.' },
  { name: '탭탭 아케이드',      url: BASE + 'spys4/',  desc: '손가락 하나로 하는 미니게임 모음.' },
  { name: '프로토타입 아케이드', url: BASE + 'spys5/',  desc: '' },
  { name: '밤의 도둑',          url: BASE + 'spys6/',  desc: '경비 시야를 피해 저택을 터는 잠입 게임.' },
  { name: 'PIXEL HOP',          url: BASE + 'spys7/',  desc: '' },
  { name: '멈춘 세계',          url: BASE + 'spys8/',  desc: '움직일 때만 시간이 흐르는 탄 피하기.' },
  { name: '빙의 대소동',        url: BASE + 'spys9/',  desc: '남의 몸에 빙의해서 도시를 난장판으로 만드는 게임.' }
];

const COLORS = [['#ff7a59','#c23b6b'],['#6be3c5','#2a7fb0'],['#ffd36b','#e0693b'],['#9d8bff','#4d3db0'],['#7cc3ff','#3b4fd0'],['#ff9ed1','#a8467c'],['#9be86b','#2a8a6b'],['#ffb36b','#b03b3b'],['#5ee0ff','#6b4de0'],['#d7ff3a','#3ba06b']];
const grid = document.getElementById('grid');
const q = document.getElementById('q');

// 카드 하나를 만든다
function makeCard(g, i) {
  const a = document.createElement('a');
  a.className = 'card'; a.href = g.url; a.target = '_blank'; a.rel = 'noopener';
  const c = COLORS[i % COLORS.length];
  const top = document.createElement('div');
  top.className = 'top'; top.style.background = 'linear-gradient(135deg,' + c[0] + ',' + c[1] + ')';
  top.textContent = String(i + 1).padStart(2, '0');
  const body = document.createElement('div'); body.className = 'body';
  const name = document.createElement('div'); name.className = 'name'; name.textContent = g.name;
  body.appendChild(name);
  if (g.lock) { const l = document.createElement('div'); l.className = 'lock'; l.textContent = '🔒 비밀번호 필요'; body.appendChild(l); }
  const d = document.createElement('p'); d.className = 'desc'; d.textContent = g.desc || ' '; body.appendChild(d);
  const go = document.createElement('div'); go.className = 'go'; go.textContent = '플레이 →'; body.appendChild(go);
  a.append(top, body);
  return a;
}

// 검색어에 맞는 카드만 보여준다
function render() {
  const w = q.value.trim().toLowerCase();
  grid.textContent = '';
  let n = 0;
  GAMES.forEach((g, i) => {
    if (w && !(g.name + ' ' + g.desc).toLowerCase().includes(w)) return;
    grid.appendChild(makeCard(g, i)); n++;
  });
  if (!n) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '찾는 게임이 없어.'; grid.appendChild(e); }
  document.getElementById('count').textContent = '게임 ' + GAMES.length + '개' + (w ? ' · 검색 결과 ' + n + '개' : '');
}
q.addEventListener('input', render);
render();
</script>
</body>
</html>
